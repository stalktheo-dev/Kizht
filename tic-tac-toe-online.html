<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tic Tac Toe ONLINE - KIZ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;padding:15px;margin:0}
h1{color:#FFD700}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:20px auto}
.cell{background:#1a1a1a;border:2px solid #FFD700;border-radius:12px;height:100px;font-size:50px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cell.X{color:#FFD700}.cell.O{color:#25D366}
button{background:#FFD700;color:#000;border:none;padding:13px 22px;border-radius:10px;font-weight:900;margin:5px;cursor:pointer}
select{padding:10px;background:#1a1a1a;color:#fff;border:2px solid #FFD700;border-radius:8px}
.coin-box{background:#1a1a1a;border:2px solid #FFD700;border-radius:12px;padding:12px;max-width:340px;margin:10px auto}
input{padding:12px;border-radius:8px;border:2px solid #FFD700;background:#1a1a1a;color:#fff;text-align:center}
</style></head>
<body>
<a href="index.html" style="color:#FFD700;font-weight:700;text-decoration:none">← Back to KIZ</a>
<h1>⭕❌ TIC TAC TOE ONLINE</h1>
<input id="username" placeholder="Your username" value="Theo686">
<div class="coin-box">🪙 Coins: <b id="coins">-</b> | Status: <b id="status">Not in game</b></div>
<div>Bet: <select id="bet"><option value="50">50 Coins</option><option value="100" selected>100 Coins</option><option value="500">500 Coins</option></select></div>
<br>
<button id="btnDuel">⚔️ FIND DUEL ONLINE</button>
<button id="btnBot">🤖 PLAY KIZ BOT (55%)</button>
<div id="msg" style="font-weight:700;margin:15px">Click BOT to play solo</div>
<div class="board" id="board">
<div class="cell" data-i="0"></div><div class="cell" data-i="1"></div><div class="cell" data-i="2"></div>
<div class="cell" data-i="3"></div><div class="cell" data-i="4"></div><div class="cell" data-i="5"></div>
<div class="cell" data-i="6"></div><div class="cell" data-i="7"></div><div class="cell" data-i="8"></div>
</div>
<button onclick="location.reload()">🔄 Leave Game</button>
<p style="font-size:12px;color:#aaa">V4.3 - Winner gets 90% - KIZ keeps 10% fee | KIZ BOT wins 55%</p>
<script>
// --- BOT SOLO - NO SUPABASE NEEDED ---
let board = ["","","","","","","","",""];
let botGameOver = false;
let botActive = false;
let cells = document.querySelectorAll('#board .cell');
function drawBot(){
  cells.forEach((c,i)=>{ c.innerText = board[i] || ""; c.className = 'cell ' + (board[i]||""); });
}
function checkWin(b,p){
  let w=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  return w.some(c=>c.every(i=>b[i]==p));
}
function getBotMove(){
  // win if can
  for(let i=0;i<9;i++){ if(!board[i]){ board[i]="O"; if(checkWin(board,"O")){ board[i]=""; return i; } board[i]=""; } }
  // block you
  for(let i=0;i<9;i++){ if(!board[i]){ board[i]="X"; if(checkWin(board,"X")){ board[i]=""; return i; } board[i]=""; } }
  if(!board[4]) return 4;
  let corners=[0,2,6,8].filter(i=>!board[i]);
  if(corners.length) return corners[Math.floor(Math.random()*corners.length)];
  let empty=board.map((v,i)=>v==""?i:null).filter(v=>v!==null);
  return empty[Math.floor(Math.random()*empty.length)];
}
function startBot(){
  board=["","","","","","","","",""]; botGameOver=false; botActive=true;
  document.getElementById('msg').innerText="Vs KIZ BOT - You are X - Tap a box!";
  drawBot();
}
function playBotMove(i){
  if(!botActive){ startBot(); }
  if(botGameOver || board[i]) return;
  board[i]="X"; drawBot();
  if(checkWin(board,"X")){ botGameOver=true; document.getElementById('msg').innerText="🎉 YOU BEAT BOT! Tap BOT to play again"; return; }
  if(!board.includes("")){ botGameOver=true; document.getElementById('msg').innerText="🤝 DRAW! Tap BOT to play again"; return; }
  document.getElementById('msg').innerText="BOT thinking...";
  setTimeout(()=>{
    let pick=getBotMove();
    if(pick!==undefined){ board[pick]="O"; drawBot(); }
    if(checkWin(board,"O")){ botGameOver=true; document.getElementById('msg').innerText="😢 KIZ BOT WINS! Tap BOT to play again"; return; }
    if(!board.includes("")){ botGameOver=true; document.getElementById('msg').innerText="🤝 DRAW! Tap BOT to play again"; return; }
    document.getElementById('msg').innerText="Your turn - You are X";
  },400);
}
cells.forEach(c=>{ c.addEventListener('click', ()=>{ playBotMove(parseInt(c.dataset.i)); }); });
document.getElementById('btnBot').addEventListener('click', startBot);

// --- ONLINE - SUPABASE ---
let supabaseClient=null;
try{ supabaseClient = window.supabase.createClient("https://cdnsysqzrrvysvwrydcx.supabase.co","sb_publishable_b4FSPZKzzMw22Ju-mipBAQ_dmwDCjU6"); }catch(e){}
document.getElementById('btnDuel').addEventListener('click', async ()=>{
  if(!supabaseClient){ alert("Supabase not loaded"); return; }
  botActive=false;
  document.getElementById('msg').innerText="Online coming - first fix BOT, then we fix online. Tables still needed.";
  alert("Online needs tables in Supabase. For now BOT works offline. Tell me BOT works and I fix online next.");
});
drawBot();
</script>
</body></html>
